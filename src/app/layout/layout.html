<div class="flex h-dvh overflow-hidden bg-gray-50">
  <!-- Backdrop of the drawer (phones only) -->
  @if (menuOpen()) {
    <div class="fixed inset-0 z-30 bg-gray-900/50 md:hidden" (click)="closeMenu()" aria-hidden="true"></div>
  }

  <app-sidebar [open]="menuOpen()" (closed)="closeMenu()" />

  <div class="flex min-w-0 flex-1 flex-col overflow-hidden">
    <app-header [menuOpen]="menuOpen()" (menuToggle)="toggleMenu()" />

    <main class="flex-1 overflow-y-auto overflow-x-hidden p-4 sm:p-6">
      <router-outlet />
    </main>
  </div>
</div>
