<!-- Phones: drawer that slides in from the left. Desktop (md+): fixed column, can be narrowed to icons. -->
<aside
  id="menu-lateral"
  class="fixed inset-y-0 left-0 z-40 flex w-72 max-w-[85vw] flex-col bg-gray-900 text-white shadow-xl transition-transform duration-300 md:static md:z-auto md:max-w-none md:translate-x-0 md:shadow-none md:transition-[width]"
  [class.-translate-x-full]="!open()"
  [class.translate-x-0]="open()"
  [class.md:w-16]="collapsed()"
  [class.md:w-64]="!collapsed()"
  aria-label="Menú"
>
  <!-- Logo -->
  <div class="flex h-14 items-center justify-between border-b border-gray-700 px-4 md:h-16">
    @if (!collapsed()) {
      <span class="text-lg font-bold tracking-tight">Notes</span>
    }
    <!-- Desktop: narrow / widen -->
    <button
      class="hidden rounded p-1 text-gray-400 transition-colors hover:bg-gray-800 hover:text-white md:block"
      (click)="toggleCollapse()"
      [attr.aria-label]="collapsed() ? 'Expandir menú' : 'Colapsar menú'"
    >
      <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <!-- Phones: close the drawer -->
    <button
      class="rounded p-2 text-gray-400 transition-colors hover:bg-gray-800 hover:text-white md:hidden"
      (click)="closed.emit()"
      aria-label="Cerrar menú"
    >
      <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 space-y-1 overflow-y-auto px-2 py-4" aria-label="Navegación principal">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-gray-800 text-white"
        class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm text-gray-300 transition-colors hover:bg-gray-800 hover:text-white md:py-2"
        [attr.title]="collapsed() ? item.label : null"
      >
        <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon" />
        </svg>
        <span [class.md:hidden]="collapsed()">{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- User / Logout -->
  <div class="border-t border-gray-700 p-3 pb-[max(0.75rem,env(safe-area-inset-bottom))]">
    <div class="flex items-center gap-3">
      <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-indigo-600 text-sm font-bold">
        {{ userInitial() }}
      </div>
      <div class="flex min-w-0 flex-1 items-center gap-2" [class.md:hidden]="collapsed()">
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-medium">{{ user()?.name }}</p>
          <p class="truncate text-xs text-gray-400">{{ user()?.email }}</p>
        </div>
        <button
          class="rounded p-2 text-gray-400 transition-colors hover:bg-gray-800 hover:text-white"
          (click)="logout()"
          aria-label="Cerrar sesión"
          title="Cerrar sesión"
        >
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2h5a2 2 0 012 2v1" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</aside>
