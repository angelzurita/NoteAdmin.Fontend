<header class="flex h-14 shrink-0 items-center gap-2 border-b border-gray-200 bg-white px-3 sm:px-6 md:h-16">
  <!-- Phones: open the side menu -->
  <button
    data-testid="menu-movil"
    class="-ml-1 rounded-lg p-2 text-gray-600 hover:bg-gray-100 md:hidden"
    (click)="menuToggle.emit()"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="menu-lateral"
    aria-label="Abrir menú"
  >
    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <!-- Back to the lab portal (Disciplina) -->
  @if (portalUrl(); as portal) {
    <a
      [href]="portal"
      data-testid="volver-disciplina"
      class="inline-flex shrink-0 items-center gap-1.5 rounded-lg border border-gray-200 px-2.5 py-1.5 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-50"
      title="Volver a Disciplina"
    >
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
      <span>Disciplina</span>
    </a>
  }

  <h2 class="min-w-0 flex-1 truncate text-base font-semibold text-gray-800 sm:text-lg">Notes</h2>

  <div class="flex shrink-0 items-center gap-3">
    <span class="hidden max-w-48 truncate text-sm text-gray-600 sm:inline">{{ userName() }}</span>
    <button
      class="rounded-md bg-gray-100 px-3 py-1.5 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-200"
      (click)="logout()"
    >
      Salir
    </button>
  </div>
</header>
